<!doctype html>
<!--
  Template Hayashi: story / reels / TV vertical 1080x1920.
  Ao copiar pra materiais/<tipo>/<pasta>/, troque ../hayashi.css e ../logo.png por ../../../identidade/...
  Render: node scripts/render.js <este.html> <pasta> --largura 1080 --altura 1920
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story Hayashi</title>
<link rel="stylesheet" href="../hayashi.css">
<style>
  .topo { padding: 120px 72px 0; }
  .meio { padding: 0 72px; }
  .baixo { position: absolute; left: 72px; right: 72px; bottom: 140px; }
</style>
</head>
<body>

<div class="hay-page story hay-fundo-petroleo">
  <img class="hay-folha" src="../elementos/folha-canto-branco.png" alt="" style="left:0; top:0; width:300px; opacity:.9">
  <img class="hay-folha" src="../elementos/folha-ramo-branco.png" alt="" style="right:-80px; bottom:260px; width:260px; transform:rotate(-30deg); opacity:.9">
  <div class="topo">
    <img class="hay-logo branco" src="../logo-branco.png" alt="Hayashi" style="height:110px">
  </div>
  <div class="meio" style="margin-top:160px">
    <p class="hay-subtitulo">Aviso</p>
    <h1 class="hay-titulo g"><span class="leve">Novo horário</span><br>do transporte</h1>
    <hr class="hay-regua">
    <p class="hay-texto" style="font-size:34px">A partir de segunda, 3/11, o ônibus da linha 2 sai às 5h40 do ponto da rodoviária.</p>
  </div>
  <div class="baixo">
    <div class="hay-card claro" style="padding:40px 48px">
      <p class="hay-texto p" style="margin:0"><strong>Dúvidas?</strong> Fale com seu líder imediato ou com o RH da unidade.</p>
    </div>
    <p class="hay-texto p hay-mt" style="opacity:.8">Recursos Humanos · Unidade Cristalina-GO</p>
  </div>
</div>

</body>
</html>
