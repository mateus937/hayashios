<!doctype html>
<!--
  Template Hayashi: certificado A4 paisagem (treinamento, SIPAT, integração, tempo de casa).
  Ao copiar pra materiais/<tipo>/<pasta>/, troque ../hayashi.css e ../logo.png por ../../../identidade/...
  PDF: node scripts/pdf.js <este.html> certificado.pdf --formato A4 --paisagem
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Certificado Hayashi</title>
<link rel="stylesheet" href="../hayashi.css">
<style>
  @page { size: A4 landscape; margin: 0; }
  .hay-page.a4-paisagem { width: 297mm; height: 210mm; padding: 14mm; }
  .moldura { border: 1.2mm solid var(--hay-petroleo); border-radius: 10mm 10mm 10mm 0; height: 100%; padding: 14mm 20mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .nome { font-family: var(--hay-fonte-titulo); font-size: 34pt; color: var(--hay-petroleo); text-transform: uppercase; margin: 6mm 0 2mm; }
  .assinaturas { display: flex; gap: 30mm; margin-top: auto; }
  .assinaturas div { width: 70mm; border-top: .5mm solid var(--hay-grafite); padding-top: 2mm; font-size: 9.5pt; color: var(--hay-grafite); }
</style>
</head>
<body>

<div class="hay-page a4-paisagem">
  <img class="hay-folha" src="../elementos/folha-canto.png" alt="" style="left:0; top:0; width:46mm">
  <img class="hay-folha" src="../elementos/folha-ramo.png" alt="" style="right:-8mm; bottom:-12mm; width:38mm; transform:rotate(200deg)">
  <div class="moldura">
    <img src="../logo.png" alt="Hayashi" style="height:28mm">
    <p class="hay-subtitulo" style="margin-top:8mm">Certificado</p>
    <p class="hay-texto doc" style="font-size:12pt; max-width:200mm">A Hayashi certifica que</p>
    <p class="nome">Maria da Silva</p>
    <p class="hay-texto doc" style="font-size:12pt; max-width:200mm">participou da <strong>Integração Cultural</strong> e do treinamento sobre o Guia do Manifesto da Cultura Hayashi (v1.7), com carga horária de 4 horas, realizado na Unidade Cristalina-GO em 27 de outubro de 2026.</p>
    <div class="assinaturas">
      <div>Recursos Humanos</div>
      <div>Gerência da Unidade</div>
    </div>
  </div>
</div>

</body>
</html>
